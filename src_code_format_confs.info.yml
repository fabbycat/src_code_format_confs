name: 'HTML Source Code: Format Configurations'
machine_name: 'src_code_format_confs'
description: 'A collection of HTML source code formats for editing content in Drupal, typically through text areas. Ranging from minimally restricted to tightly restricted these formats can be reused in modules and when managing content through the Drupal administration interface.'
